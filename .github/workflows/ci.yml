name: AUREON PRIME CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aureon-prime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore safety tests
        run: dotnet restore tests/Aureon.Core.SmokeTests/Aureon.Core.SmokeTests.csproj

      - name: Run safety tests
        run: dotnet run --project tests/Aureon.Core.SmokeTests/Aureon.Core.SmokeTests.csproj -c Release --no-restore

      - name: Pull official cTrader CLI image
        run: docker pull ghcr.io/spotware/ctrader-console:latest

      - name: Show cTrader CLI version
        run: docker run --rm ghcr.io/spotware/ctrader-console:latest --version

      - name: Inspect official cTrader C# scaffold
        run: |
          rm -rf /tmp/ctrader-probe
          mkdir -p /tmp/ctrader-probe
          docker run --rm \
            -v "/tmp/ctrader-probe:/workspace" \
            -w /workspace \
            ghcr.io/spotware/ctrader-console:latest \
            create cbot ProbeBot
          find /tmp/ctrader-probe -maxdepth 3 -type f -print
          find /tmp/ctrader-probe -type f -name '*.csproj' -exec sh -c 'echo "=== $1 ==="; cat "$1"' _ {} \;

      - name: Build AUREON PRIME with cTrader CLI
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/spotware/ctrader-console:latest \
            build src/Aureon.Prime/Aureon.Prime.csproj

      - name: Locate .algo package
        id: algo
        shell: bash
        run: |
          FILE="$(find src/Aureon.Prime -type f -name '*.algo' -print -quit)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Built $FILE"

      - name: Upload validated package
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AUREON_PRIME
          path: ${{ steps.algo.outputs.file }}
          if-no-files-found: error
          retention-days: 7
