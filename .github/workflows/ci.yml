name: AUREON PRIME CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aureon-prime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore safety tests
        run: dotnet restore tests/Aureon.Core.SmokeTests/Aureon.Core.SmokeTests.csproj

      - name: Run safety tests
        run: dotnet run --project tests/Aureon.Core.SmokeTests/Aureon.Core.SmokeTests.csproj -c Release --no-restore

      - name: Pull official cTrader CLI image
        run: docker pull ghcr.io/spotware/ctrader-console:latest

      - name: Show cTrader CLI version
        run: docker run --rm ghcr.io/spotware/ctrader-console:latest --version

      - name: Build AUREON PRIME with cTrader CLI
        run: |
          rm -rf /tmp/aureon-calgo
          mkdir -p /tmp/aureon-calgo/Sources/Robots/AUREON_PRIME/AUREON_PRIME
          mkdir -p /tmp/aureon-calgo/Sources/Robots/AUREON_PRIME/Aureon.Core
          cp -R src/Aureon.Prime/. /tmp/aureon-calgo/Sources/Robots/AUREON_PRIME/AUREON_PRIME/
          cp -R src/Aureon.Core/. /tmp/aureon-calgo/Sources/Robots/AUREON_PRIME/Aureon.Core/
          docker run --rm \
            -v "/tmp/aureon-calgo:/root/cAlgo" \
            ghcr.io/spotware/ctrader-console:latest \
            build /root/cAlgo/Sources/Robots/AUREON_PRIME/AUREON_PRIME/Aureon.Prime.csproj

      - name: Locate .algo package
        id: algo
        shell: bash
        run: |
          FILE="$(find /tmp/aureon-calgo -type f -name '*.algo' -print -quit)"
          test -n "$FILE"
          mkdir -p artifacts
          cp "$FILE" artifacts/AUREON_PRIME.algo
          echo "file=artifacts/AUREON_PRIME.algo" >> "$GITHUB_OUTPUT"
          echo "Built $FILE"

      - name: Upload validated package
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AUREON_PRIME
          path: ${{ steps.algo.outputs.file }}
          if-no-files-found: error
          retention-days: 7
